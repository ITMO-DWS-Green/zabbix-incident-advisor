# Ведёт список чатов бота и его команды (/join, /github, …) и напоминает о встречах (задачи с меткой «встреча») в Telegram за сутки, за час и за 15 минут с тегами.
name: Встречи

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # запись кэша со списком чатов и отправленными напоминаниями
  issues: write   # протокол встречи — комментарием в задаче
  pull-requests: read

# один запуск за раз: команды бота обрабатываются ровно один раз
concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  remind:
    name: Напоминания
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github
      - name: Список чатов бота
        uses: actions/cache/restore@v4
        with:
          path: chats.json
          key: telegram-chats-${{ github.run_id }}
          restore-keys: telegram-chats-
      - name: Отправленные напоминания
        uses: actions/cache/restore@v4
        with:
          path: sent.json
          key: meeting-sent-${{ github.run_id }}
          restore-keys: meeting-sent-
      - name: Напомнить
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHATS: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: python3 .github/scripts/meeting_reminders.py
      - name: Запомнить отправленные
        if: always() && hashFiles('sent.json') != ''
        uses: actions/cache/save@v4
        with:
          path: sent.json
          key: meeting-sent-${{ github.run_id }}
      - name: Сохранить список чатов
        if: always() && hashFiles('chats.json') != ''
        uses: actions/cache/save@v4
        with:
          path: chats.json
          key: telegram-chats-${{ github.run_id }}
