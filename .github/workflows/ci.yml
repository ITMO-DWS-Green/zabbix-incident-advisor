name: CI

on:
  push:
  pull_request:

jobs:
  service:
    name: Сервис — сборка и тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Сборка и тесты
        run: ./gradlew build --continue 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Ошибки сборки в аннотации
        if: failure()
        run: |
          grep -E "error:|FAILED|Exception|expected|but was" build.log | head -40 | while IFS= read -r line; do
            echo "::error title=build::${line//%/%25}"
          done
          for f in $(find . -path '*test-results*' -name '*.xml'); do
            grep -l "<failure" "$f" >/dev/null && grep -A3 "<failure" "$f" | head -8 | tr '\n' ' ' | sed 's/%/%25/g' | xargs -0 -I{} echo "::error title=test $(basename $f)::{}"
          done

  e2e:
    name: Сквозная проверка — Zabbix, сервис, модуль, стенд
    runs-on: ubuntu-latest
    needs: service
    timeout-minutes: 30
    env:
      ADVISOR_ANALYSIS_DELAY: 20s
    steps:
      - uses: actions/checkout@v5
      - name: Поднять всё
        run: docker compose --profile stand up -d --build
      - name: Настройка Zabbix через API
        run: |
          code=$(docker wait "$(docker compose ps -aq setup)")
          docker compose logs --no-log-prefix setup
          test "$code" = "0"
      - name: Модуль интерфейса открывается
        run: |
          for i in $(seq 1 30); do curl -sf localhost:8070/ping && break; sleep 5; done
          docker compose exec -T zabbix-web test -f /usr/share/zabbix/modules/incident-advisor/manifest.json
      - name: Сбой → триггер → коннектор → разбор → комментарий → оценка
        run: python3 infra/setup/e2e_test.py
      - name: Логи при ошибке
        if: failure()
        run: |
          docker compose --profile stand ps -a
          for svc in advisor setup zabbix-server zabbix-web; do
            echo "===== $svc"; docker compose logs --tail 80 --no-log-prefix $svc
            tail=$(docker compose logs --no-log-prefix --tail 30 "$svc" 2>&1 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$svc::$tail"
          done
