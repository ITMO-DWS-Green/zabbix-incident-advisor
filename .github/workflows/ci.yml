name: CI

# Когда что запускается:
# - на PR в main и на push в main (без дублей push + PR на одну ветку);
# - сборка и тесты — только если менялся service/ или сам CI;
# - сквозная проверка — только если менялось то, что влияет на работу системы
#   (код сервиса, не тесты; модуль интерфейса; infra/; compose.yaml; CI);
# - вручную (Actions → CI → Run workflow) — всё.
# Пропущенная проверка считается пройденной для защиты main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Что изменилось
    runs-on: ubuntu-latest
    outputs:
      service: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.service == 'true' }}
      e2e: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.e2e == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            service:
              - 'service/**'
              - '.github/workflows/ci.yml'
            e2e:
              - 'service/*/src/main/**'
              - 'service/**/*.gradle.kts'
              - 'service/gradle/**'
              - 'service/Dockerfile'
              - 'zabbix-module/**'
              - 'infra/**'
              - 'compose.yaml'
              - '.github/workflows/ci.yml'

  service:
    name: Сервис — сборка и тесты
    needs: changes
    if: needs.changes.outputs.service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Сборка и тесты
        run: ./gradlew build --continue 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Ошибки сборки в аннотации
        if: failure()
        run: |
          grep -E "error:|FAILED|Exception|expected|but was" build.log | head -40 | while IFS= read -r line; do
            echo "::error title=build::${line//%/%25}"
          done
          for f in $(find . -path '*test-results*' -name '*.xml'); do
            grep -l "<failure" "$f" >/dev/null && grep -A3 "<failure" "$f" | head -8 | tr '\n' ' ' | sed 's/%/%25/g' | xargs -0 -I{} echo "::error title=test $(basename $f)::{}"
          done

  e2e:
    name: Сквозная проверка — Zabbix, сервис, модуль, стенд
    needs: [changes, service]
    # запускаем, даже если сборку пропустили (менялись только модуль или infra), но не после её падения
    if: >-
      always() && needs.changes.outputs.e2e == 'true' &&
      (needs.service.result == 'success' || needs.service.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADVISOR_ANALYSIS_DELAY: 20s
    steps:
      - uses: actions/checkout@v5
      - name: Поднять всё
        run: docker compose --profile stand up -d --build
      - name: Настройка Zabbix через API
        run: |
          code=$(docker wait "$(docker compose ps -aq setup)")
          docker compose logs --no-log-prefix setup
          test "$code" = "0"
      - name: Модуль интерфейса открывается
        run: |
          for i in $(seq 1 30); do curl -sf localhost:8070/ping && break; sleep 5; done
          docker compose exec -T zabbix-web test -f /usr/share/zabbix/modules/incident-advisor/manifest.json
      - name: Сбой → триггер → коннектор → разбор → комментарий → оценка
        run: python3 infra/setup/e2e_test.py
      - name: Логи при ошибке
        if: failure()
        run: |
          docker compose --profile stand ps -a
          for svc in advisor setup zabbix-server zabbix-web; do
            echo "===== $svc"; docker compose logs --tail 80 --no-log-prefix $svc
            tail=$(docker compose logs --no-log-prefix --tail 30 "$svc" 2>&1 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$svc::$tail"
          done
