name: CI

on:
  push:
  pull_request:

jobs:
  service:
    name: Сервис — сборка и тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Сборка и тесты
        run: ./gradlew build --continue 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Ошибки сборки в аннотации
        if: failure()
        run: |
          grep -E "error:|FAILED|Exception|expected|but was" build.log | head -40 | while IFS= read -r line; do
            echo "::error title=build::${line//%/%25}"
          done
          for f in $(find . -path '*test-results*' -name '*.xml'); do
            grep -l "<failure" "$f" >/dev/null && grep -A3 "<failure" "$f" | head -8 | tr '\n' ' ' | sed 's/%/%25/g' | xargs -0 -I{} echo "::error title=test $(basename $f)::{}"
          done
