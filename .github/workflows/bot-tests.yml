name: Тесты Telegram-бота

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/team.json'
      - '.github/workflows/bot-tests.yml'
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/team.json'
      - '.github/workflows/bot-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python — тесты бота без сети
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
